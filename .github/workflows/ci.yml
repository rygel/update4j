name: CI

on:
  push:
    branches: [ master, main, 'feature/*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['11', '17', '21', '25']
    
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
      
      - name: Set Maven flags
        id: mvn-flags
        shell: bash
        run: |
          if [[ "${{ matrix.java }}" == "11" || "${{ matrix.java }}" == "17" ]]; then
            echo "extra=-Dcheckstyle.skip -Dpmd.skip" >> "$GITHUB_OUTPUT"
          else
            echo "extra=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: mvn --batch-mode -DskipTests package ${{ steps.mvn-flags.outputs.extra }}

      - name: Test
        run: mvn --batch-mode test ${{ steps.mvn-flags.outputs.extra }}
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-java${{ matrix.java }}
          path: target/surefire-reports/
      
      - name: Generate coverage report (Linux Java 17)
        if: matrix.os == 'ubuntu-latest' && matrix.java == '17'
        run: mvn jacoco:report
      
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.java == '17'
        uses: codecov/codecov-action@v4
        with:
          file: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
